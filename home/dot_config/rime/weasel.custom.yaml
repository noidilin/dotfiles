patch:
  app_options:
    cmd.exe:
      ascii_mode: true
      ascii_punct: true
    idea64.exe:
      ascii_mode: true
      ascii_punct: true
    Code.exe:
      ascii_mode: true
      ascii_punct: true
    pwsh.exe:
      ascii_mode: true
      ascii_punct: true
    powershell.exe:
      ascii_mode: true
      ascii_punct: true
    windowsterminal.exe:
      ascii_mode: true
      ascii_punct: true
    firefox.exe:
      inline_preedit: true # 規避 https://github.com/rime/weasel/pull/1462，0.17.4 之後的正式版可移除

  show_notifications: true
  show_notifications_time: 1200
  global_ascii: false

  style:
    color_scheme: achroma

    font_face: "Glow Sans TC:bold"
    label_font_face: "Glow Sans TC:medium"
    comment_font_face: "Glow Sans TC"
    font_point: 16
    label_font_point: 14
    comment_font_point: 14

    inline_preedit: false
    preedit_type: composition

    fullscreen: false
    horizontal: false
    vertical_text: false
    text_orientation: horizontal
    vertical_text_left_to_right: false
    vertical_text_with_wrap: false
    vertical_auto_reverse: false

    label_format: "%s"
    mark_text: ""
    ascii_tip_follow_cursor: false
    enhanced_position: true
    display_tray_icon: false
    antialias_mode: cleartype
    blur_window: true
    candidate_abbreviate_length: 30
    mouse_hover_ms: 0
    hover_type: none

    paging_on_scroll: true
    click_to_capture: false

    layout:
      baseline: 0
      linespacing: 0
      align_type: center
      max_height: 600
      max_width: 0
      min_height: 0
      min_width: 10
      border_width: 3
      margin_x: 20
      margin_y: 16
      spacing: 12
      candidate_spacing: 6
      hilite_spacing: 12
      hilite_padding: 6
      shadow_radius: 5
      shadow_offset_x: 3
      shadow_offset_y: 3
      corner_radius: 16
      round_corner: 10

  preset_color_schemes:
    achroma:
      name: "achroma"
      author: noidilin
      color_format: rgba
      text_color: 0xb3b3b3
      back_color: 0x2a2a2a
      hilited_text_color: 0xeaeaea
      hilited_back_color: 0x4e4e4e
      border_color: 0x353535
      label_color: 0x9d9d9d
      comment_text_color: 0x707070
      shadow_color: 0x151515b4
      candidate_text_color: 0xb3b3b3
      hilited_comment_text_color: 0x191919
      hilited_candidate_label_color: 0x191919
      hilited_candidate_text_color: 0x191919
      hilited_candidate_back_color: 0xb3b3b3
