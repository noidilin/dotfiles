# Squirrel settings
# encoding: utf-8

# 鼠须管界面配置指南： https://github.com/LEOYoon-Tsaw/Rime_collections/blob/master/鼠鬚管介面配置指南.md
# 鼠须管作者写的图形化的皮肤设计器： https://github.com/LEOYoon-Tsaw/Squirrel-Designer

# 要比共享目录的同名文件的 config_version 大才可以生效
config_version: "noidilin" # config_version: '1.0.3'

patch:
  # ascii_mode、inline、no_inline、vim_mode 等等设定
  # 可参考 /Library/Input Methods/Squirrel.app/Contents/SharedSupport/squirrel.yaml
  app_options:
    # org.vim.MacVim:
    #   ascii_mode: true  # 初始爲西文模式
    #   no_inline: true   # 不使用行內編輯
    #   vim_mode: true    # 退出VIM插入模式自動切換輸入法狀態
    com.apple.Spotlight:
      ascii_mode: true
    com.apple.Terminal:
      ascii_mode: true
      no_inline: true
    com.github.wez.wezterm:
      ascii_mode: true
      no_inline: true
    com.googlecode.iterm2:
      ascii_mode: true
      no_inline: true
    com.apple.dt.Xcode:
      ascii_mode: true
    com.microsoft.VSCode:
      ascii_mode: true
    org.gnu.Emacs:
      ascii_mode: true
      no_inline: true
    com.google.Chrome:
      inline: true # 規避 https://github.com/rime/squirrel/issues/435
    com.microsoft.edgemac:
      inline: true # 規避 https://github.com/rime/squirrel/issues/906

  style:
    # 选择皮肤，亮色与暗色主题
    color_scheme: achroma
    color_scheme_dark: achroma

    # 以下是预设选项。如果皮肤没写，则使用这些属性；如果皮肤写了，使用皮肤的。

    # 候选框与文字的排列方式
    candidate_list_layout: stacked # 候选项排列方向 stacked(默认) | linear
    text_orientation: horizontal # 文字排列方向 horizontal(默认) | vertical
    # 拼音或词句是否显示在键入位置
    inline_preedit: true # 键入码（拼音）是否显示在键入位置 true | false
    inline_candidate: false # 候选项（词句）是否显示在键入位置 true | false

    # Whether candidate panel stick to screen edge to reduce jumping
    memorize_size: true
    # Whether transparent colors stack on each other
    mutual_exclusive: false
    # Whether to use a translucent background. Only visible when background color is transparent
    translucency: false
    # Enable to show small arrows that indicates if paging up/down is possible
    show_paging: false

    # Controls non-hililighted candidate background size, relative to highlighted
    # Nagetive means shrink, positive meas expand
    # surrounding_extra_expansion: 0

    # format using %@ and %c is deprecated since 1.0, Squirrel 1.0
    # %@ is automatically expanded to "[candidate] [comment]"
    # and %c is replaced by "[label]"
    candidate_format: "[label]. [candidate] [comment]" # 候选项格式化

    # adjust the base line of text
    # base_offset: 0
    # 如果将字体设置为 PingFangSC-Regular
    # 会让 🈶🈚️🉑🈲🉐 这几个 Emoji 失去彩色效果，留空反而可以显示。。。
    font_face: "" # 字体及大小
    font_point: 18
    label_font_face: "Helvetica" # 序号字体及大小
    label_font_point: 12
    comment_font_face: "Helvetica" # 注字体及大小
    comment_font_point: 16

  # 皮肤列表
  preset_color_schemes:
    achroma:
      name: "achroma"
      author: noidilin
      border_height: 0 # 外边框 高
      border_width: 0 # 外边框 宽
      corner_radius: 10 # 外边框 圆角半径
      hilited_corner_radius: 6 # 选中框 圆角半径
      surrounding_extra_expansion: 0 # 候选项背景相对大小？
      shadow_size: 0 # 阴影大小
      line_spacing: 5 # 行间距
      spacing: 10 # 拼音与候选项之间的距离 （inline_preedit: false）

      base_offset: 0 # 字基高 base line
      alpha: 1 # 透明度，0~1

      color_space: srgb # 色彩空间： srgb | display_p3
      text_color: 0xb3b3b3 # 拼音颜色 （inline_preedit: false）
      back_color: 0x2a2a2a # 底色
      hilited_text_color: 0xeaeaea # 选中拼音颜色 （inline_preedit: false）
      hilited_back_color: 0x4e4e4e # 选中拼音底色 （inline_preedit: false）
      border_color: 0x353535 # 外边框颜色
      label_color: 0x9d9d9d # 序号颜色
      comment_text_color: 0x707070 # 注颜色
      candidate_text_color: 0xb3b3b3 # 文字颜色
      hilited_comment_text_color: 0x191919 # 选中注颜色
      hilited_candidate_label_color: 0x191919 # 选中序号颜色
      hilited_candidate_text_color: 0x191919 # 选中文字颜色
      hilited_candidate_back_color: 0xb3b3b3 # 选中底色
      # preedit_back_color:                   # 拼音底色 （inline_preedit: false）
