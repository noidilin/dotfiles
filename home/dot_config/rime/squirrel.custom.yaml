config_version: "noidilin"

patch:
  app_options:
    com.apple.Spotlight:
      ascii_mode: true
    com.apple.Terminal:
      ascii_mode: true
      no_inline: true
    com.github.wez.wezterm:
      ascii_mode: true
      no_inline: true
    com.googlecode.iterm2:
      ascii_mode: true
      no_inline: true
    com.apple.dt.Xcode:
      ascii_mode: true
    com.microsoft.VSCode:
      ascii_mode: true
    org.gnu.Emacs:
      ascii_mode: true
      no_inline: true
    com.google.Chrome:
      inline: true
    com.microsoft.edgemac:
      inline: true # 規避 https://github.com/rime/squirrel/issues/906

  style:
    color_scheme: achroma
    color_scheme_dark: achroma

    candidate_list_layout: stacked
    text_orientation: horizontal
    inline_preedit: true
    inline_candidate: false

    memorize_size: true
    mutual_exclusive: false
    translucency: false
    show_paging: false

    candidate_format: "[label]. [candidate] [comment]"

    font_face: ""
    font_point: 18
    label_font_face: "Helvetica"
    label_font_point: 12
    comment_font_face: "Helvetica"
    comment_font_point: 16

  preset_color_schemes:
    achroma:
      name: "achroma"
      author: noidilin
      border_height: 0
      border_width: 0
      corner_radius: 10
      hilited_corner_radius: 6
      surrounding_extra_expansion: 0
      shadow_size: 0
      line_spacing: 5
      spacing: 10

      base_offset: 0
      alpha: 1

      color_space: srgb
      text_color: 0xb3b3b3
      back_color: 0x2a2a2a
      hilited_text_color: 0xeaeaea
      hilited_back_color: 0x4e4e4e
      border_color: 0x353535
      label_color: 0x9d9d9d
      comment_text_color: 0x707070
      candidate_text_color: 0xb3b3b3
      hilited_comment_text_color: 0x191919
      hilited_candidate_label_color: 0x191919
      hilited_candidate_text_color: 0x191919
      hilited_candidate_back_color: 0xb3b3b3
