title: Productivity Keymap
version: 1.0.0
author: noidilin
maintainers: [noidilin]
description: Ergonomic keymap for terminal/Vim and design workflows

x-parameters:

  hyper-timing: &hyper-timing
    basic.to_if_alone_timeout_milliseconds: 200
    basic.to_if_held_down_threshold_milliseconds: 50

  capslock-timing: &capslock-timing
    basic.to_if_alone_timeout_milliseconds: 200
    basic.to_if_held_down_threshold_milliseconds: 50

  space-timing: &space-timing
    basic.to_if_alone_timeout_milliseconds: 200
    basic.to_if_held_down_threshold_milliseconds: 50

  tab-timing: &tab-timing
    basic.to_if_alone_timeout_milliseconds: 200
    basic.to_if_held_down_threshold_milliseconds: 50

rules:

  - description: Basic Key Modifications
    manipulators:
      - description: "capslock = esc(tap) | caps_layer(hold)"
        type: basic
        from:
          key_code: caps_lock
          modifiers:
            optional: [any]
        to_if_held_down:
          - set_variable:
              name: caps_layer
              value: 1
              key_up_value: 0
        to_if_alone:
          - key_code: escape
        parameters:
          <<: *capslock-timing

      - description: "semicolon = ;(tap) | right shift(hold)"
        type: basic
        from:
          key_code: semicolon
          modifiers:
            optional: [any]
        to:
          - key_code: right_shift
        to_if_alone:
          - key_code: semicolon
        parameters:
          <<: *hyper-timing

      - description: "quote = '(tap) | option(hold)"
        type: basic
        from:
          key_code: quote
          modifiers:
            optional: [any]
        to:
          - key_code: left_option
        to_if_alone:
          - key_code: quote
        parameters:
          <<: *hyper-timing

      - description: "open bracket = [(tap) | ctrl(hold)"
        type: basic
        from:
          key_code: open_bracket
          modifiers:
            optional: [any]
        to:
          - key_code: right_control
        to_if_alone:
          - key_code: open_bracket
        parameters:
          <<: *hyper-timing

      - description: ". = ."
        type: basic
        from:
          key_code: period
          modifiers:
            optional: [any]
        to:
          - key_code: period
        parameters:
          <<: *hyper-timing

  - description: Caps Layer - Functionality
    manipulators:
      - description: "caps + space = delete"
        type: basic
        from:
          key_code: spacebar
          modifiers:
            optional: [any]
        to:
          - key_code: delete_or_backspace
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + g = return"
        type: basic
        from:
          key_code: g
          modifiers:
            optional: [any]
        to:
          - key_code: return_or_enter
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  - description: Caps Layer - Left Hand (bot row)
    manipulators:
      - description: "caps + z = y"
        type: basic
        from:
          key_code: z
          modifiers:
            optional: [any]
        to:
          - key_code: "y"
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + x = u"
        type: basic
        from:
          key_code: x
          modifiers:
            optional: [any]
        to:
          - key_code: u
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + c = i"
        type: basic
        from:
          key_code: c
          modifiers:
            optional: [any]
        to:
          - key_code: i
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + v = o"
        type: basic
        from:
          key_code: v
          modifiers:
            optional: [any]
        to:
          - key_code: o
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + b = p"
        type: basic
        from:
          key_code: b
          modifiers:
            optional: [any]
        to:
          - key_code: p
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  - description: Caps Layer - Left Hand (top row)
    manipulators:
      - description: "caps + tab = home"
        type: basic
        from:
          key_code: tab
          modifiers:
            optional: [any]
        to:
          - key_code: home
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + q = h"
        type: basic
        from:
          key_code: q
          modifiers:
            optional: [any]
        to:
          - key_code: h
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + w = j"
        type: basic
        from:
          key_code: w
          modifiers:
            optional: [any]
        to:
          - key_code: j
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + e = k"
        type: basic
        from:
          key_code: e
          modifiers:
            optional: [any]
        to:
          - key_code: k
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + r = l"
        type: basic
        from:
          key_code: r
          modifiers:
            optional: [any]
        to:
          - key_code: l
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + t = end"
        type: basic
        from:
          key_code: t
          modifiers:
            optional: [any]
        to:
          - key_code: end
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  - description: Caps Layer - Left Hand (mid row)
    manipulators:
      - description: "caps + a = left"
        type: basic
        from:
          key_code: a
          modifiers:
            optional: [any]
        to:
          - key_code: left_arrow
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + s = down"
        type: basic
        from:
          key_code: s
          modifiers:
            optional: [any]
        to:
          - key_code: down_arrow
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + d = up"
        type: basic
        from:
          key_code: d
          modifiers:
            optional: [any]
        to:
          - key_code: up_arrow
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + f = right"
        type: basic
        from:
          key_code: f
          modifiers:
            optional: [any]
        to:
          - key_code: right_arrow
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  - description: Caps Layer - Right Hand (mid row)
    manipulators:
      - description: "caps + h = ^ (line start)"
        type: basic
        from:
          key_code: h
          modifiers:
            optional: [any]
        to:
          - key_code: "6"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + j = $ (line end)"
        type: basic
        from:
          key_code: j
          modifiers:
            optional: [any]
        to:
          - key_code: "4"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + k = { (prev paragraph)"
        type: basic
        from:
          key_code: k
          modifiers:
            optional: [any]
        to:
          - key_code: open_bracket
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + l = } (next paragraph)"
        type: basic
        from:
          key_code: l
          modifiers:
            optional: [any]
        to:
          - key_code: close_bracket
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  - description: Caps Layer - Right Hand (top row)
    manipulators:
      - description: "caps + y = # (prev match word)"
        type: basic
        from:
          key_code: "y"
          modifiers:
            optional: [any]
        to:
          - key_code: "3"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + u = * (next match word)"
        type: basic
        from:
          key_code: u
          modifiers:
            optional: [any]
        to:
          - key_code: "8"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + i = ("
        type: basic
        from:
          key_code: i
          modifiers:
            optional: [any]
        to:
          - key_code: "9"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + o = )"
        type: basic
        from:
          key_code: o
          modifiers:
            optional: [any]
        to:
          - key_code: "0"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  - description: Caps Layer - Right Hand (bot row)
    manipulators:
      - description: "caps + n = %"
        type: basic
        from:
          key_code: "n"
          modifiers:
            optional: [any]
        to:
          - key_code: "5"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + m = @"
        type: basic
        from:
          key_code: m
          modifiers:
            optional: [any]
        to:
          - key_code: "2"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      - description: "caps + , = &"
        type: basic
        from:
          key_code: comma
          modifiers:
            optional: [any]
        to:
          - key_code: "7"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  - description: Space Layer - Modifier Activation
    manipulators:
      - description: "space = space(tap) | layer(hold)"
        type: basic
        from:
          key_code: spacebar
        to_if_alone:
          - key_code: spacebar
            halt: true
        to_if_held_down:
          - set_variable:
              name: space_layer
              value: 1
              key_up_value: 0
        conditions:
          - type: variable_unless
            name: tab_layer
            value: 1
        parameters:
          <<: *space-timing

  - description: Space Layer - Symbols (top row)
    manipulators:
      - description: "space + tab = `"
        type: basic
        from:
          key_code: tab
          modifiers:
            optional: [any]
        to:
          - key_code: grave_accent_and_tilde
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + q = -"
        type: basic
        from:
          key_code: q
          modifiers:
            optional: [any]
        to:
          - key_code: hyphen
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + w = ="
        type: basic
        from:
          key_code: w
          modifiers:
            optional: [any]
        to:
          - key_code: equal_sign
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + e = ["
        type: basic
        from:
          key_code: e
          modifiers:
            optional: [any]
        to:
          - key_code: open_bracket
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + r = ]"
        type: basic
        from:
          key_code: r
          modifiers:
            optional: [any]
        to:
          - key_code: close_bracket
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: 'space + t = \'
        type: basic
        from:
          key_code: t
          modifiers:
            optional: [any]
        to:
          - key_code: backslash
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

  - description: Space Layer - Symbols (mid row)
    manipulators:
      - description: "space + a = ;"
        type: basic
        from:
          key_code: a
          modifiers:
            optional: [any]
        to:
          - key_code: semicolon
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + s = '"
        type: basic
        from:
          key_code: s
          modifiers:
            optional: [any]
        to:
          - key_code: quote
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + d = ,"
        type: basic
        from:
          key_code: d
          modifiers:
            optional: [any]
        to:
          - key_code: comma
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + f = ."
        type: basic
        from:
          key_code: f
          modifiers:
            optional: [any]
        to:
          - key_code: period
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + g = /"
        type: basic
        from:
          key_code: g
          modifiers:
            optional: [any]
        to:
          - key_code: slash
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

  - description: Space Layer - Function Keys (bot row)
    manipulators:
      - description: "space + z = f1"
        type: basic
        from:
          key_code: z
          modifiers:
            optional: [any]
        to:
          - key_code: f1
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + x = f2"
        type: basic
        from:
          key_code: x
          modifiers:
            optional: [any]
        to:
          - key_code: f2
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + c = f3"
        type: basic
        from:
          key_code: c
          modifiers:
            optional: [any]
        to:
          - key_code: f3
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + v = f4"
        type: basic
        from:
          key_code: v
          modifiers:
            optional: [any]
        to:
          - key_code: f4
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + b = f5"
        type: basic
        from:
          key_code: b
          modifiers:
            optional: [any]
        to:
          - key_code: f5
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

  - description: Space Layer - Function Keys (right hand top row)
    manipulators:
      - description: "space + y = f6"
        type: basic
        from:
          key_code: y
          modifiers:
            optional: [any]
        to:
          - key_code: f6
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + u = f7"
        type: basic
        from:
          key_code: u
          modifiers:
            optional: [any]
        to:
          - key_code: f7
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + i = f8"
        type: basic
        from:
          key_code: i
          modifiers:
            optional: [any]
        to:
          - key_code: f8
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + o = f9"
        type: basic
        from:
          key_code: o
          modifiers:
            optional: [any]
        to:
          - key_code: f9
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + p = f10"
        type: basic
        from:
          key_code: p
          modifiers:
            optional: [any]
        to:
          - key_code: f10
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

  - description: Space Layer - Function Keys (right hand mid row)
    manipulators:
      - description: "space + h = f11"
        type: basic
        from:
          key_code: h
          modifiers:
            optional: [any]
        to:
          - key_code: f11
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      - description: "space + j = f12"
        type: basic
        from:
          key_code: j
          modifiers:
            optional: [any]
        to:
          - key_code: f12
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

  - description: Tab Layer - Modifier Activation
    manipulators:
      - description: "tab = tab(tap) | layer(hold)"
        type: basic
        from:
          key_code: tab
        to_if_alone:
          - key_code: tab
            halt: true
        to_if_held_down:
          - set_variable:
              name: tab_layer
              value: 1
              key_up_value: 0
        parameters:
          <<: *tab-timing

  - description: Tab Layer - Numbers (top row)
    manipulators:
      - description: "tab + w = 1"
        type: basic
        from:
          key_code: w
          modifiers:
            optional: [any]
        to:
          - key_code: "1"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

      - description: "tab + e = 2"
        type: basic
        from:
          key_code: e
          modifiers:
            optional: [any]
        to:
          - key_code: "2"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

      - description: "tab + r = 3"
        type: basic
        from:
          key_code: r
          modifiers:
            optional: [any]
        to:
          - key_code: "3"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

      - description: "tab + t = 4"
        type: basic
        from:
          key_code: t
          modifiers:
            optional: [any]
        to:
          - key_code: "4"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

  - description: Tab Layer - Numbers (mid row)
    manipulators:
      - description: "tab + s = 5"
        type: basic
        from:
          key_code: s
          modifiers:
            optional: [any]
        to:
          - key_code: "5"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

      - description: "tab + d = 6"
        type: basic
        from:
          key_code: d
          modifiers:
            optional: [any]
        to:
          - key_code: "6"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

      - description: "tab + f = 7"
        type: basic
        from:
          key_code: f
          modifiers:
            optional: [any]
        to:
          - key_code: "7"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

      - description: "tab + g = 8"
        type: basic
        from:
          key_code: g
          modifiers:
            optional: [any]
        to:
          - key_code: "8"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

  - description: Tab Layer - Numbers (bot row)
    manipulators:
      - description: "tab + x = 9"
        type: basic
        from:
          key_code: x
          modifiers:
            optional: [any]
        to:
          - key_code: "9"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

      - description: "tab + c = 0"
        type: basic
        from:
          key_code: c
          modifiers:
            optional: [any]
        to:
          - key_code: "0"
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

      - description: "tab + v = -"
        type: basic
        from:
          key_code: v
          modifiers:
            optional: [any]
        to:
          - key_code: hyphen
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

      - description: "tab + b = ="
        type: basic
        from:
          key_code: b
          modifiers:
            optional: [any]
        to:
          - key_code: equal_sign
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1

  - description: Tab Layer - Special
    manipulators:
      - description: "tab + space = delete"
        type: basic
        from:
          key_code: spacebar
          modifiers:
            optional: [any]
        to:
          - key_code: delete_or_backspace
        conditions:
          - type: variable_if
            name: tab_layer
            value: 1
