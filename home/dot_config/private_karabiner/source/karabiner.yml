  # ----------------------------------------------------------------------------
  # TAB LAYER - MODIFIER ACTIVATION
  # ----------------------------------------------------------------------------
  # Tab key acts as a layer modifier when held:
  # - Tap: Normal tab
  # - Hold: Activates tab_layer variable for one-handed number input

  - description: Tab Layer - Modifier Activation
    manipulators:
      # Tab key activates layer on hold, outputs tab on tap
      - description: "tab = tab(tap) | layer(hold)"
        type: basic
        from:
          key_code: tab
        to_if_alone:
          - key_code: tab
            halt: true
        to_if_held_down:
          - set_variable:
              name: tab_layer
              value: 1
              key_up_value: 0
        parameters:
          <<: *tab-timing

