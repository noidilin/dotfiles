# ==============================================================================
# Productivity Keymap for macOS
# ==============================================================================
# Full documentation: ~/.local/share/chezmoi/docs/karabiner.md
#
# This configuration provides ergonomic key mappings for terminal/Vim workflows
# and design work, using layers and modifier keys for efficient one-handed input.
#
# Layer System:
# - Caps Layer (CapsLock hold): left-hand Vim navigation, arrows, symbols
# - Semicolon Layer (Semicolon hold): right-hand Vim navigation and symbols
# - Space Layer (Space): One-handed symbols and function keys
# - Tab Layer (Tab): One-handed number input

title: Productivity Keymap
version: 1.0.0
author: noidilin
maintainers: [noidilin]
description: Ergonomic keymap for terminal/Vim and design workflows

# ==============================================================================
# TIMING PARAMETERS (YAML Anchors)
# ==============================================================================
# These anchors define reusable timing values for different key behaviors.
# Reference: https://karabiner-elements.pqrs.org/docs/json/

x-parameters:
  # - to_if_alone_timeout: Maximum time for a tap to register
  # - to_if_held_down_threshold: Minimum time to activate hold behavior

  # Hyper key timing (Tab/Semicolon)
  hyper-timing: &hyper-timing
    basic.to_if_alone_timeout_milliseconds: 200
    basic.to_if_held_down_threshold_milliseconds: 50

  # CapsLock timing
  capslock-timing: &capslock-timing
    basic.to_if_alone_timeout_milliseconds: 200
    basic.to_if_held_down_threshold_milliseconds: 50

  # Space layer timing (variable-based modifier)
  space-timing: &space-timing
    basic.to_if_alone_timeout_milliseconds: 200
    basic.to_if_held_down_threshold_milliseconds: 50

  # Tab layer timing (variable-based modifier)
  tab-timing: &tab-timing
    basic.to_if_alone_timeout_milliseconds: 200
    basic.to_if_held_down_threshold_milliseconds: 50

# ==============================================================================
# RULES
# ==============================================================================

rules:
  # ----------------------------------------------------------------------------
  # BASIC KEY MODIFICATIONS
  # ----------------------------------------------------------------------------
  # Core dual-role keys that serve as foundation for other layers:
  # - CapsLock: tap → Esc, hold → Caps layer
  # - Semicolon: tap → ;, hold → Semicolon layer
  # - H: tap → h, hold → Ctrl

  - description: Basic Key Modifications
    manipulators:
      # CapsLock: tap → Esc, hold → Caps layer
      - description: "capslock = esc(tap) | caps_layer(hold)"
        type: basic
        from:
          key_code: caps_lock
          modifiers:
            optional: [any]
        to_if_held_down:
          - set_variable:
              name: caps_layer
              value: 1
              key_up_value: 0
        to_if_alone:
          - key_code: escape
        parameters:
          <<: *capslock-timing

      # Semicolon: tap → ;, hold → Semicolon layer
      # Note: Excludes activation when Space layer is active to allow space+; combination
      - description: "semicolon = ;(tap) | semicolon_layer(hold)"
        type: basic
        from:
          key_code: semicolon
          modifiers:
            optional: [any]
        to_if_held_down:
          - set_variable:
              name: semicolon_layer
              value: 1
              key_up_value: 0
        to_if_alone:
          - key_code: semicolon
        conditions:
          # Don't activate when space layer is active (for space+; → F12 combination)
          - type: variable_unless
            name: space_layer
            value: 1
        parameters:
          <<: *hyper-timing

      # [: tap → [, hold → Ctrl
      - description: "[ = [(tap) | ctrl(hold)"
        type: basic
        from:
          key_code: open_bracket
          modifiers:
            optional: [any]
        to:
          - key_code: right_control
        to_if_alone:
          - key_code: open_bracket
        parameters:
          <<: *hyper-timing

      # .: tap → ., hold → Alt
      - description: ". = .(tap) | alt(hold)"
        type: basic
        from:
          key_code: period
          modifiers:
            optional: [any]
        to:
          - key_code: left_option
        to_if_alone:
          - key_code: period
        parameters:
          <<: *hyper-timing

  # ----------------------------------------------------------------------------
  # CAPS / SEMICOLON LAYERS - FUNCTIONALITY
  # ----------------------------------------------------------------------------
  # Essential functions available in both layer triggers:
  # - Space → Delete (backspace)
  # - G → Return (enter)

  - description: Caps / Semicolon Layers - Functionality
    manipulators:
      # caps + space → delete
      - description: "caps + space = delete"
        type: basic
        from:
          key_code: spacebar
          modifiers:
            optional: [any]
        to:
          - key_code: delete_or_backspace
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # semicolon + space → delete
      - description: "semicolon + space = delete"
        type: basic
        from:
          key_code: spacebar
          modifiers:
            optional: [any]
        to:
          - key_code: delete_or_backspace
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

      # caps + G → return
      - description: "caps + g = return"
        type: basic
        from:
          key_code: g
          modifiers:
            optional: [any]
        to:
          - key_code: return_or_enter
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # semicolon + G → return
      - description: "semicolon + g = return"
        type: basic
        from:
          key_code: g
          modifiers:
            optional: [any]
        to:
          - key_code: return_or_enter
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

  # ----------------------------------------------------------------------------
  # CAPS LAYER - LEFT HAND (Bot Row)
  # ----------------------------------------------------------------------------
  # Vim character keys (continued):
  # - Z → Y
  # - X → U
  # - C → I
  # - V → O
  # - B → P

  - description: Caps Layer - Left Hand (bot row)
    manipulators:
      # caps + Z → y
      - description: "caps + z = y"
        type: basic
        from:
          key_code: z
          modifiers:
            optional: [any]
        to:
          - key_code: "y"
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + X → u
      - description: "caps + x = u"
        type: basic
        from:
          key_code: x
          modifiers:
            optional: [any]
        to:
          - key_code: u
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + C → i
      - description: "caps + c = i"
        type: basic
        from:
          key_code: c
          modifiers:
            optional: [any]
        to:
          - key_code: i
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + V → o
      - description: "caps + v = o"
        type: basic
        from:
          key_code: v
          modifiers:
            optional: [any]
        to:
          - key_code: o
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + B → p
      - description: "caps + b = p"
        type: basic
        from:
          key_code: b
          modifiers:
            optional: [any]
        to:
          - key_code: p
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  # ----------------------------------------------------------------------------
  # CAPS LAYER - EXTENDED NAVIGATION
  # ----------------------------------------------------------------------------
  # CAPS LAYER - LEFT HAND (Top Row)
  # ----------------------------------------------------------------------------
  # Vim character keys and document navigation:
  # - Tab → Home
  # - Q → H
  # - W → J
  # - E → K
  # - R → L
  # - T → End

  - description: Caps Layer - Left Hand (top row)
    manipulators:
      # caps + Tab → home
      - description: "caps + tab = home"
        type: basic
        from:
          key_code: tab
          modifiers:
            optional: [any]
        to:
          - key_code: home
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + Q → h
      - description: "caps + q = h"
        type: basic
        from:
          key_code: q
          modifiers:
            optional: [any]
        to:
          - key_code: h
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + W → j
      - description: "caps + w = j"
        type: basic
        from:
          key_code: w
          modifiers:
            optional: [any]
        to:
          - key_code: j
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + E → k
      - description: "caps + e = k"
        type: basic
        from:
          key_code: e
          modifiers:
            optional: [any]
        to:
          - key_code: k
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + R → l
      - description: "caps + r = l"
        type: basic
        from:
          key_code: r
          modifiers:
            optional: [any]
        to:
          - key_code: l
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + T → end
      - description: "caps + t = end"
        type: basic
        from:
          key_code: t
          modifiers:
            optional: [any]
        to:
          - key_code: end
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  # ----------------------------------------------------------------------------
  # CAPS LAYER - LEFT HAND (Mid Row)
  # ----------------------------------------------------------------------------
  # Arrow key navigation:
  # - A → Left
  # - S → Down
  # - D → Up
  # - F → Right

  - description: Caps Layer - Left Hand (mid row)
    manipulators:
      # caps + A → left
      - description: "caps + a = left"
        type: basic
        from:
          key_code: a
          modifiers:
            optional: [any]
        to:
          - key_code: left_arrow
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + S → down
      - description: "caps + s = down"
        type: basic
        from:
          key_code: s
          modifiers:
            optional: [any]
        to:
          - key_code: down_arrow
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + D → up
      - description: "caps + d = up"
        type: basic
        from:
          key_code: d
          modifiers:
            optional: [any]
        to:
          - key_code: up_arrow
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

      # caps + F → right
      - description: "caps + f = right"
        type: basic
        from:
          key_code: f
          modifiers:
            optional: [any]
        to:
          - key_code: right_arrow
        conditions:
          - type: variable_if
            name: caps_layer
            value: 1

  # ----------------------------------------------------------------------------
  # SEMICOLON LAYER - RIGHT HAND (Mid Row)
  # ----------------------------------------------------------------------------
  # Vim line navigation symbols (HJKL):
  # - H → ^ (shift+6, start of line)
  # - J → $ (shift+4, end of line)
  # - K → { (shift+[, previous paragraph)
  # - L → } (shift+], next paragraph)

  - description: Semicolon Layer - Right Hand (mid row)
    manipulators:
      # semicolon + H → ^ (shift+6)
      - description: "semicolon + h = ^ (line start)"
        type: basic
        from:
          key_code: h
          modifiers:
            optional: [any]
        to:
          - key_code: "6"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

      # semicolon + J → $ (shift+4)
      - description: "semicolon + j = $ (line end)"
        type: basic
        from:
          key_code: j
          modifiers:
            optional: [any]
        to:
          - key_code: "4"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

      # semicolon + K → { (shift+[)
      - description: "semicolon + k = { (prev paragraph)"
        type: basic
        from:
          key_code: k
          modifiers:
            optional: [any]
        to:
          - key_code: open_bracket
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

      # semicolon + L → } (shift+])
      - description: "semicolon + l = } (next paragraph)"
        type: basic
        from:
          key_code: l
          modifiers:
            optional: [any]
        to:
          - key_code: close_bracket
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

  # ----------------------------------------------------------------------------
  # SEMICOLON LAYER - RIGHT HAND (Top Row)
  # ----------------------------------------------------------------------------
  # Vim search symbols:
  # - Y → # (shift+3, previous match word)
  # - U → * (shift+8, next match word)
  # - I → % (shift+5, match bracket)
  # - O → @ (shift+2, at symbol)

  - description: Semicolon Layer - Right Hand (top row)
    manipulators:
      # semicolon + Y → # (shift+3)
      - description: "semicolon + y = # (prev match word)"
        type: basic
        from:
          key_code: "y"
          modifiers:
            optional: [any]
        to:
          - key_code: "3"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

      # semicolon + U → * (shift+8)
      - description: "semicolon + u = * (next match word)"
        type: basic
        from:
          key_code: u
          modifiers:
            optional: [any]
        to:
          - key_code: "8"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

      # semicolon + I → ( (shift+9)
      - description: "semicolon + i = ("
        type: basic
        from:
          key_code: i
          modifiers:
            optional: [any]
        to:
          - key_code: "9"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

      # semicolon + O → ) (shift+0)
      - description: "semicolon + o = )"
        type: basic
        from:
          key_code: o
          modifiers:
            optional: [any]
        to:
          - key_code: "0"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

  # ----------------------------------------------------------------------------
  # SEMICOLON LAYER - RIGHT HAND (Bot Row)
  # ----------------------------------------------------------------------------
  # Additional symbols:
  # - N → % (shift+5)
  # - M → @ (shift+2)
  # - , → & (shift+7)

  - description: Semicolon Layer - Right Hand (bot row)
    manipulators:
      # semicolon + N → % (shift+5)
      - description: "semicolon + n = %"
        type: basic
        from:
          key_code: "n"
          modifiers:
            optional: [any]
        to:
          - key_code: "5"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

      # semicolon + M → @ (shift+2)
      - description: "semicolon + m = @"
        type: basic
        from:
          key_code: m
          modifiers:
            optional: [any]
        to:
          - key_code: "2"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

      # semicolon + , → & (shift+7)
      - description: "semicolon + , = &"
        type: basic
        from:
          key_code: comma
          modifiers:
            optional: [any]
        to:
          - key_code: "7"
            modifiers: [left_shift]
        conditions:
          - type: variable_if
            name: semicolon_layer
            value: 1

  # ----------------------------------------------------------------------------
  # SPACE LAYER - MODIFIER ACTIVATION
  # ----------------------------------------------------------------------------
  # Space key acts as a layer modifier when held:
  # - Tap: Normal space
  # - Hold: Activates space_layer variable for one-handed input

  - description: Space Layer - Modifier Activation
    manipulators:
      # Space key activates layer on hold, outputs space on tap (SpaceFN pattern)
      - description: "space = space(tap) | layer(hold)"
        type: basic
        from:
          key_code: spacebar
        to_if_alone:
          - key_code: spacebar
            halt: true
        to_if_held_down:
          - set_variable:
              name: space_layer
              value: 1
              key_up_value: 0
        conditions:
          # Don't activate when tab layer is active (for tab+space → . combination)
          - type: variable_unless
            name: tab_layer
            value: 1
        parameters:
          <<: *space-timing

  # ----------------------------------------------------------------------------
  # SPACE LAYER - SYMBOLS (Top Row)
  # ----------------------------------------------------------------------------
  # Top row (QWERT) symbols for one-handed programming:
  # - Tab → ` (backtick)
  # - Q → - (hyphen/minus)
  # - W → = (equals)
  # - E → [ (open bracket)
  # - R → ] (close bracket)
  # - T → \ (backslash)

  - description: Space Layer - Symbols (top row)
    manipulators:
      # space + Tab → `
      - description: "space + tab = `"
        type: basic
        from:
          key_code: tab
          modifiers:
            optional: [any]
        to:
          - key_code: grave_accent_and_tilde
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + Q → -
      - description: "space + q = -"
        type: basic
        from:
          key_code: q
          modifiers:
            optional: [any]
        to:
          - key_code: hyphen
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + W → =
      - description: "space + w = ="
        type: basic
        from:
          key_code: w
          modifiers:
            optional: [any]
        to:
          - key_code: equal_sign
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + E → [
      - description: "space + e = ["
        type: basic
        from:
          key_code: e
          modifiers:
            optional: [any]
        to:
          - key_code: open_bracket
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + R → ]
      - description: "space + r = ]"
        type: basic
        from:
          key_code: r
          modifiers:
            optional: [any]
        to:
          - key_code: close_bracket
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + T → \
      - description: 'space + t = \'
        type: basic
        from:
          key_code: t
          modifiers:
            optional: [any]
        to:
          - key_code: backslash
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

  # ----------------------------------------------------------------------------
  # SPACE LAYER - SYMBOLS (Mid Row)
  # ----------------------------------------------------------------------------
  # Mid row (ASDFG) punctuation symbols:
  # - A → ;
  # - S → '
  # - D → ,
  # - F → .
  # - G → /

  - description: Space Layer - Symbols (mid row)
    manipulators:
      # space + A → ;
      - description: "space + a = ;"
        type: basic
        from:
          key_code: a
          modifiers:
            optional: [any]
        to:
          - key_code: semicolon
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + S → '
      - description: "space + s = '"
        type: basic
        from:
          key_code: s
          modifiers:
            optional: [any]
        to:
          - key_code: quote
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + D → ,
      - description: "space + d = ,"
        type: basic
        from:
          key_code: d
          modifiers:
            optional: [any]
        to:
          - key_code: comma
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + F → .
      - description: "space + f = ."
        type: basic
        from:
          key_code: f
          modifiers:
            optional: [any]
        to:
          - key_code: period
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + G → /
      - description: "space + g = /"
        type: basic
        from:
          key_code: g
          modifiers:
            optional: [any]
        to:
          - key_code: slash
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

  # ----------------------------------------------------------------------------
  # SPACE LAYER - FUNCTION KEYS (Bot Row)
  # ----------------------------------------------------------------------------
  # Bottom row (ZXCV) function keys:
  # - Z → F1
  # - X → F2
  # - C → F3
  # - V → F4

  - description: Space Layer - Function Keys (bot row)
    manipulators:
      # space + Z → F1
      - description: "space + z = f1"
        type: basic
        from:
          key_code: z
          modifiers:
            optional: [any]
        to:
          - key_code: f1
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + X → F2
      - description: "space + x = f2"
        type: basic
        from:
          key_code: x
          modifiers:
            optional: [any]
        to:
          - key_code: f2
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + C → F3
      - description: "space + c = f3"
        type: basic
        from:
          key_code: c
          modifiers:
            optional: [any]
        to:
          - key_code: f3
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + V → F4
      - description: "space + v = f4"
        type: basic
        from:
          key_code: v
          modifiers:
            optional: [any]
        to:
          - key_code: f4
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

  # ----------------------------------------------------------------------------
  # SPACE LAYER - FUNCTION KEYS (Right Hand Top Row)
  # ----------------------------------------------------------------------------
  # Right hand top row (UIOP) function keys:
  # - U → F5
  # - I → F6
  # - O → F7
  # - P → F8

  - description: Space Layer - Function Keys (right hand top row)
    manipulators:
      # space + U → F5
      - description: "space + u = f5"
        type: basic
        from:
          key_code: u
          modifiers:
            optional: [any]
        to:
          - key_code: f5
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + I → F6
      - description: "space + i = f6"
        type: basic
        from:
          key_code: i
          modifiers:
            optional: [any]
        to:
          - key_code: f6
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + O → F7
      - description: "space + o = f7"
        type: basic
        from:
          key_code: o
          modifiers:
            optional: [any]
        to:
          - key_code: f7
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + P → F8
      - description: "space + p = f8"
        type: basic
        from:
          key_code: p
          modifiers:
            optional: [any]
        to:
          - key_code: f8
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

  # ----------------------------------------------------------------------------
  # SPACE LAYER - FUNCTION KEYS (Right Hand Mid Row)
  # ----------------------------------------------------------------------------
  # Right hand mid row (JKL;) function keys:
  # - J → F9
  # - K → F10
  # - L → F11
  # - ; → F12

  - description: Space Layer - Function Keys (right hand mid row)
    manipulators:
      # space + J → F9
      - description: "space + j = f9"
        type: basic
        from:
          key_code: j
          modifiers:
            optional: [any]
        to:
          - key_code: f9
        conditions:
          - type: variable_if
            name: space_layer
            value: 1

      # space + K → F10
      - description: "space + k = f10"
        type: basic
        from:
