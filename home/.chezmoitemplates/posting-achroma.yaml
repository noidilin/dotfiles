name: {{ .name }}
author: noid
description: Warm monochrome {{ .variant }} theme inspired by opencode achroma.

primary: "{{ .c.acc07 }}"
secondary: "{{ .c.mono23 }}"
accent: "{{ .c.acc04 }}"
background: "{{ .c.mantle }}"
surface: "{{ .c.mono04 }}"

error: "{{ .c.red }}"
success: "{{ .c.green }}"
warning: "{{ .c.flamingo }}"

method:
  get: "{{ .c.blue }}"
  post: "{{ .c.green }}"
  put: "{{ .c.flamingo }}"
  delete: "{{ .c.red }}"

text_area:
  cursor: "reverse"
  cursor_line: "underline {{ .c.surface1 }}"
  selection: "reverse"
  gutter: "{{ .c.mono12 }}"
  matched_bracket: "bold {{ .c.mono24 }}"

url:
  base: "{{ .c.mono18 }}"
  protocol: "bold {{ .c.acc03 }}"

syntax:
  json_key: "{{ .c.lavender }}"
  json_number: "{{ .c.mono25 }}"
  json_string: "{{ .c.mono16 }}"
  json_boolean: "{{ .c.pink }}"
  json_null: "italic {{ .c.sapphire }}"
