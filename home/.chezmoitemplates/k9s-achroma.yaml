# Warm monochrome skin aligned with lazygit/lazydocker achroma theme.
# Rendered from the shared achroma palette (.chezmoidata/colors.yml); every
# slot survives role mirroring, so dark and light share this body verbatim.

foreground: &foreground "{{ .c.mono17 }}"
background: &background "{{ .c.mono02 }}"
accent: &accent "{{ .c.acc07 }}"
highlight: &highlight "{{ .c.acc08 }}"
focus: &focus "{{ .c.mono19 }}"
muted: &muted "{{ .c.mono13 }}"
selection: &selection "{{ .c.mono05 }}"
surface: &surface "{{ .c.mono09 }}"
success: &success "{{ .c.green00 }}"
warning: &warning "{{ .c.orange00 }}"
error: &error "{{ .c.red00 }}"
info: &info "{{ .c.blue00 }}"

k9s:
  body:
    fgColor: *foreground
    bgColor: *background
    logoColor: *accent
    logoColorMsg: *highlight
    logoColorInfo: *info
    logoColorWarn: *warning
    logoColorError: *error
  prompt:
    fgColor: *foreground
    bgColor: *background
    suggestColor: *highlight
    border:
      command: *accent
      default: *focus
  info:
    fgColor: *accent
    sectionColor: *highlight
    cpuColor: *success
    memColor: *info
    k9sRevColor: *accent
  help:
    fgColor: *foreground
    bgColor: *background
    keyColor: *accent
    numKeyColor: *highlight
    sectionColor: *focus
  dialog:
    fgColor: *foreground
    bgColor: *background
    buttonFgColor: *foreground
    buttonBgColor: *selection
    buttonFocusFgColor: *highlight
    buttonFocusBgColor: *surface
    labelFgColor: *accent
    fieldFgColor: *focus
  frame:
    border:
      fgColor: *muted
      focusColor: *focus
    menu:
      fgColor: *foreground
      keyColor: *accent
      numKeyColor: *highlight
    crumbs:
      fgColor: *foreground
      bgColor: *selection
      activeColor: *highlight
    status:
      newColor: *foreground
      modifyColor: *accent
      addColor: *success
      pendingColor: *warning
      errorColor: *error
      highlightColor: *highlight
      killColor: *muted
      completedColor: *muted
    title:
      fgColor: *foreground
      bgColor: *background
      highlightColor: *highlight
      counterColor: *accent
      filterColor: *focus
  views:
    charts:
      bgColor: *background
      dialBgColor: *background
      chartBgColor: *background
      defaultDialColors:
        - *accent
        - *error
      defaultChartColors:
        - *accent
        - *info
      resourceColors:
        cpu:
          - *success
          - *muted
        mem:
          - *info
          - *surface
      focusFgColor: *highlight
      focusBgColor: *surface
    table:
      fgColor: *foreground
      bgColor: *background
      cursorFgColor: *highlight
      cursorBgColor: *surface
      markColor: *focus
      header:
        fgColor: *focus
        bgColor: *background
        sorterColor: *highlight
        selectedSortColumnColor: *accent
    xray:
      fgColor: *foreground
      bgColor: *background
      cursorColor: *selection
      cursorTextColor: *highlight
      graphicColor: *accent
      showIcons: false
    yaml:
      keyColor: *accent
      colonColor: *focus
      valueColor: *foreground
    logs:
      fgColor: *foreground
      bgColor: *background
      indicator:
        fgColor: *foreground
        bgColor: *background
        toggleOnColor: *success
        toggleOffColor: *warning
    help:
      fgColor: *foreground
      bgColor: *background
      keyColor: *accent
      numKeyColor: *highlight
      sectionColor: *focus
      indicator:
        fgColor: *focus
    picker:
      mainColor: *foreground
      focusColor: *accent
      shortcutColor: *highlight
