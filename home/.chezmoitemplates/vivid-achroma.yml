colors:
{{- range $k, $v := .c }}
  {{ $k }}: '{{ trimPrefix "#" $v }}'
{{- end }}

core:
  normal_text:
    foreground: mono16
  regular_file:
    foreground: mono16
  reset_to_normal:
    background: mantle
    foreground: mono16
    font-style: regular
  directory:
    foreground: mono18
    font-style: bold
  symlink:
    foreground: accDim02
  multi_hard_link:
    foreground: accDim02
    font-style: underline
  fifo:
    foreground: accDim05
    font-style:
      - bold
      - underline
  socket:
    foreground: mono23
    font-style: bold
  door:
    foreground: mono23
    font-style: italic
  block_device:
    foreground: mono23
    font-style: underline
  character_device:
    foreground: mono23
  broken_symlink:
    foreground: red
  missing_symlink_target:
    background: red
    foreground: surface1
    font-style: bold
  setuid:
    foreground: mono16
    font-style:
      - bold
      - underline
  setgid:
    foreground: mono16
    font-style:
      - bold
      - underline
  file_with_capability:
    foreground: mono16
    font-style:
      - bold
      - underline
  sticky_other_writable:
    background: accDim02
    foreground: surface0
    font-style:
      - bold
      - underline
  other_writable:
    background: accDim02
    foreground: surface0
    font-style: bold
  sticky:
    background: accDim02
    foreground: surface0
    font-style: underline
  executable_file:
    foreground: accDim05
    font-style: bold

text:
  foreground: overlay0
  configuration:
    foreground: mono16
    dockerfile:
      foreground: subtext1
    nix:
      foreground: subtext1
  licenses:
    foreground: mono14
  special:
    foreground: mono16
    font-style: italic
  todo:
    foreground: mono16
    font-style: italic

markup:
  foreground: mono16
  web:
    foreground: subtext1

programming:
  source:
    foreground: accDim05
  tooling:
    foreground: mono16
    continuous-integration:
      foreground: text
    vcs:
      foreground: mono16
      git:
        foreground: subtext1

media:
  foreground: overlay1
  fonts:
    foreground: mono16
    font-style: italic
  image:
    foreground: overlay1
    font-style: italic
  audio:
    foreground: overlay0
    font-style: italic
  video:
    foreground: overlay0
    font-style:
      - italic
      - underline
  3d:
    foreground: surface2
    font-style: italic

office:
  foreground: mono16
  font-style: italic

archives:
  foreground: overlay2
  font-style: underline

executable:
  foreground: accDim05
  font-style: bold

unimportant:
  foreground: surface2
