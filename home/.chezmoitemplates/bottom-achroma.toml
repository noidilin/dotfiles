"$schema" = "https://github.com/ClementTsang/bottom/blob/main/schema/v0.10/bottom.json"

[flags]
processes.default_memory_value = true

[styles]
theme = "default"

[styles.cpu]
all_entry_color = '{{ .c.accDim07 }}'
avg_entry_color = '{{ .c.accDim06 }}'
cpu_core_colors = [ '{{ .c.maroon }}', '{{ .c.yellow }}', '{{ .c.teal }}', '{{ .c.rosewater }}', '{{ .c.acc07 }}', '{{ .c.acc05 }}', '{{ .c.acc03 }}', '{{ .c.acc01 }}', '{{ .c.overlay1 }}', '{{ .c.overlay0 }}' ]

[styles.memory]
ram_color = '{{ .c.mono22 }}'
cache_color = '{{ .c.overlay2 }}'
swap_color = '{{ .c.subtext1 }}'
arc_color = '{{ .c.overlay1 }}'
gpu_colors = [ '{{ .c.red }}', '{{ .c.mauve }}', '{{ .c.sapphire }}', '{{ .c.peach }}', '{{ .c.flamingo }}', '{{ .c.green }}' ]

[styles.network]
rx_color = '{{ .c.mono20 }}'
tx_color = '{{ .c.overlay2 }}'
rx_total_color = '{{ .c.mono22 }}'
tx_total_color = '{{ .c.subtext1 }}'

[styles.battery]
high_battery_color = '{{ .c.green }}'
medium_battery_color = '{{ .c.peach }}'
low_battery_color = '{{ .c.red }}'

[styles.tables]
headers = { color = '{{ .c.acc07 }}', bold = true }

[styles.graphs]
graph_color = '{{ .c.overlay2 }}'
legend_text = { color = '{{ .c.subtext1 }}' }

[styles.widgets]
border_color = '{{ .ink.border }}'
selected_border_color = '{{ .c.overlay2 }}'
widget_title = { color = '{{ .c.acc08 }}' }
text = { color = '{{ .c.subtext0 }}' }
selected_text = {color = '{{ .c.mono25 }}', bg_color = '{{ .ink.selectionBg }}'}
disabled_text = {color = '{{ .c.overlay0 }}'}

[[row]]
  ratio=20
  [[row.child]]
    type="net"
  [[row.child]]
    [[row.child.child]]
      type="disk"
[[row]]
  ratio=40
  [[row.child]]
    type="mem"
  [[row.child]]
    type="cpu"
[[row]]
  ratio=40
  [[row.child]]
    type="proc"
    default=true
