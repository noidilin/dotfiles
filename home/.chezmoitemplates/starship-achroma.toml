"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭](bold frame)\
$shell\
$username\
$directory\
$git_branch$git_status\
$package$mise\
[$nodejs$bun$lua$python$c$cpp$rust$zig$golang](fg:overlay0)\
$fill\
$cmd_duration\
$aws$kubernetes$terraform\
$os\
$time\
$line_break\
[╰─](bold frame)\
$character"""

palette = 'noidilin'

[palettes.noidilin]
{{- range $k, $v := .c }}
{{ $k }} = '{{ $v }}'
{{- end }}
frame = '{{ .ink.frame }}'

[fill]
symbol = ' '

[character]
success_symbol = '[](bold fg:text)'
error_symbol = '[](bold fg:red)'

[shell]
disabled = false
format = '[  $indicator ]($style)'
style = 'fg:text'

[username]
format = '[ $user ]($style)'
style_user = 'fg:subtext1 bold'
style_root = 'fg:acc08 bold'

[directory]
format = '[ $path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
style = 'fg:subtext0'

[git_branch]
symbol = ''
format = '[[ $symbol $branch ](fg:overlay2)]($style)'
style = 'bg:surface2'

[git_status]
format = '[[($all_status$ahead_behind )](fg:overlay2)]($style)'
style = 'bg:surface2'

[package]
format = ' is [$symbol$version]($style)'
symbol = ' '
style = 'surface2 bold'

[mise]
disabled = true
format = ' on [$symbol$health]($style)'
style = 'surface2 bold'

[memory_usage]
disabled = false
threshold = 0
format = '[ ${ram_pct}](fg:overlay0)'

[cmd_duration]
disabled = false
min_time = 500
show_milliseconds = true
format = '[ [$duration](fg:overlay1)]($style)'
style = 'fg:surface2 bold'

[os]
disabled = true
format = '[ $symbol]($style)'
style = 'fg:overlay0'

[os.symbols]
Windows = ' win'
Macos = '󰀵 mac'
Arch = '󰣇 arch'

[time]
disabled = false
format = '[ [$time](fg:surface2)]($style)'
time_format = '%R'
style = 'fg:frame bold'

[nodejs]
symbol = ''
format = ' $symbol( $version)'

[bun]
symbol = ''
format = ' $symbol( $version)'

[lua]
symbol = ''
format = ' $symbol( $version)'

[swift]
symbol = ''
format = ' $symbol( $version)'

[c]
symbol = ''
format = ' $symbol( $version)'

[cpp]
symbol = ''
format = ' $symbol( $version)'

[rust]
symbol = ''
format = ' $symbol( $version)'

[zig]
symbol = ''
format = ' $symbol( $version)'

[golang]
symbol = ''
format = ' $symbol( $version)'

[python]
symbol = ''
format = ' $symbol( $version)'

[docker_context]
symbol = ''
format = '[ $symbol( $context) ](fg:acc07 bg:mono08)'

[kubernetes]
disabled = false
symbol = 'k8s:'
format = '[ $symbol$context( ns:$namespace)]($style)'
style = 'fg:overlay0'

[[kubernetes.contexts]]
context_pattern = '.*prod.*|.*production.*'
context_alias = 'prod'
style = 'bold fg:red'
symbol = 'k8s:'

[[kubernetes.contexts]]
context_pattern = '.*stage.*|.*staging.*'
context_alias = 'stage'
style = 'fg:overlay0'
symbol = 'k8s:'

[[kubernetes.contexts]]
context_pattern = '.*dev.*|.*development.*'
context_alias = 'dev'
style = 'fg:overlay0'
symbol = 'k8s:'

[terraform]
symbol = 'tf:'
format = '[ $symbol$workspace]($style)'
style = 'fg:overlay0'

[aws]
symbol = 'aws:'
format = '[ $symbol$profile( region:$region)( expires:$duration)]($style)'
style = 'fg:overlay0'
expiration_symbol = 'expired'
force_display = false
