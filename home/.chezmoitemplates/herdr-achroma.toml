onboarding = false

[terminal]
default_shell = "nu"

[ui]
show_agent_labels_on_pane_borders = true
status_indicators = "symbols"

[ui.toast]
delivery = "terminal"

[keys]
prefix = "ctrl+q"

help = "prefix+?"
settings = "prefix+shift+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"
edit_scrollback = "prefix+e"
copy_mode = "prefix+y"
# A key action takes an array, so the direct chord is additive rather than a
# replacement. Ctrl+, has no legacy encoding and herdr never negotiates the
# kitty keyboard protocol, so it only arrives when the host terminal forwards
# it -- ghostty/config does that with `keybind = ctrl+comma=csi:44;5u`.
goto = ["prefix+g", "ctrl+comma"]

split_horizontal = "prefix+minus"
split_vertical = "prefix+backslash"
close_pane = "prefix+x"
zoom = "prefix+z"
rename_pane = "prefix+shift+p"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
resize_mode = "prefix+s"
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"

new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
close_tab = "prefix+ampersand"
switch_tab = "prefix+1..9"
# Direct chords mirror zellij; ghostty/config forwards them as csi:9;5u and
# csi:9;6u, the same way it forwards ctrl+comma for goto.
next_tab = ["prefix+n", "ctrl+tab"]
previous_tab = ["prefix+p", "ctrl+shift+tab"]
move_tab_previous = "prefix+shift+comma"
move_tab_next = "prefix+shift+period"

workspace_picker = "prefix+w"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
new_worktree = "prefix+shift+g"
switch_workspace = "prefix+shift+1..9"

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"
navigate_workspace_up = "up"
navigate_workspace_down = "down"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "smart-splits.nvim.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "smart-splits.nvim.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "smart-splits.nvim.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "smart-splits.nvim.right"
description = "navigate right (vim/herdr)"

[theme]
name = "terminal"

[theme.custom]
accent = "{{ .c.acc04 }}"
panel_bg = "reset"
# Sidebar rows have independent backgrounds; do not inherit ANSI bright-black.
active_row_bg = "{{ .c.surface0 }}"
selection_bg = "{{ .c.surface1 }}"
surface0 = "{{ .c.surface0 }}"
surface1 = "{{ .c.surface1 }}"
surface_dim = "{{ .c.base }}"
overlay0 = "{{ if (get . "light") }}{{ .c.subtext0 }}{{ else }}{{ .c.overlay0 }}{{ end }}"
overlay1 = "{{ .c.overlay1 }}"
text = "{{ .c.text }}"
subtext0 = "{{ .c.subtext0 }}"
red = "{{ .c.red }}"
green = "{{ .c.green }}"
yellow = "{{ .c.peach }}"
blue = "{{ .c.blue }}"
mauve = "{{ .c.mauve }}"
teal = "{{ .c.sapphire }}"
peach = "{{ .c.flamingo }}"
