# macOS-specific packages (Homebrew)
# These packages are only for macOS and use Homebrew-specific names

pkgs:
  brew:
    - "git-lfs"
    - "cargo-binstall"
    - "mas" # mac app store CLI
    - "zsh-syntax-highlighting"

    # macOS development and CLI tools
    - "agent-browser"
    - "aws-amplify"
    - "aws-sso-cli"
    - "beads"
    - "cmake"
    - "colima" # OSS docker/k8s VM via lima; pulls in lima as a dependency
    - "docker-buildx" # cli plugin, linked via .dev/docker/cli-plugins
    - "docker-compose" # cli plugin, linked via .dev/docker/cli-plugins
    - "docker-credential-helper" # docker-credential-osxkeychain for credsStore
    - "git-filter-repo"
    - "herdr"
    - "jj"
    - "jjui"
    - "lazydocker"
    - "make"
    - "mole"
    - "pngpaste"
    - "yt-dlp"
    - "zellij"

    - "--cask antinote"
    - "--cask appcleaner"
    - "--cask claude-code"
    - "--cask cleanshot" # screen capture + record, key cast
    - "--cask font-commit-mono-nerd-font"
    - "--cask font-geist-mono-nerd-font"
    - "--cask font-linux-libertine"
    - "--cask font-noto-sans-cjk"
    - "--cask font-noto-sans-tc"
    - "--cask font-noto-serif-cjk"
    - "--cask font-sarasa-gothic" # metric-matched CJK fallback for CommitMono
    - "--cask ghostty"
    - "--cask google-chrome"
    - "--cask karabiner-elements"
    # - "--cask ogdesign-eagle" # image reference
    # - "--cask proxy-audio-device" # control external audio interfaces with macOS system volume control
    - "--cask pika"
    - "--cask rodecaster" # manage rodecaster device
    # - "--cask squirrel-app"
    - "--cask utm"
    # - "--cask waves-central" # VSA plugins
    - "--cask omniwm"
    - "--cask linear"
    # - "--cask marginnote" # installed from mas
    - "--cask macwhisper"

    # wait to be synced with common pkgs
    - "qpdf"
    - "llamaindex-liteparse"
    - "diffnav" # delta powered differ that has file explorer
    - "worktrunk"

    # earily testing
    # - "--cask rafaelswi/menubarusb/menubarusb" # display conntected usb device spec
    - "--cask kamillobinski/thock/thock"
    - "--cask TheBoredTeam/boring-notch/boring-notch"
    # TODO: needed support
    # not in homebrew [blender launcher](https://github.com/Victor-IX/Blender-Launcher-V2)
