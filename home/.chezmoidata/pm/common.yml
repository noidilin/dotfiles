# =============================================================================
# Unified Cross-Platform Package Configuration
# =============================================================================
# Defines ALL packages installed across macOS, Windows, and Arch Linux.
# Each package specifies platform-specific package names/IDs.
#
# Valid Platform Keys:
#   brew:   macOS package name (Homebrew)
#   scoop:  Windows package name (Scoop)
#   winget: Windows package ID (WinGet)
#   pacman: Arch Linux package name (official repos)
#   aur:    Arch Linux package name (AUR via yay)
#
# Special Flags:
#   wsl: false  - Excludes package from Arch WSL2 (for GUI apps only)
#                 Omit for CLI tools (they're included by default)
#
# Examples:
#   git:
#     brew: "git"
#     scoop: "git"
#     pacman: "git"
#
#   nushell:
#     brew: "nushell"
#     scoop: "nu"
#     pacman: "nushell"
#
#   vscode:
#     wsl: false
#     brew: "visual-studio-code"
#     scoop: "vscode"
#     pacman: "code"
# =============================================================================

pkgs:
  common:
    # =============================================================================
    # Bootstrap (pre-chezmoi requirements)
    # =============================================================================
    1password-cli:
      wsl: false
      brew: "--cask 1password-cli"
      winget: "AgileBits.1Password.CLI"
