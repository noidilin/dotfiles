# common package manager for different device
# - windows: scoop
# - arch: pacman
# - darwin: brew

pkgs:
  common:
    - "7zip"
    - "age"
    - "ast-grep"
    - "bat"
    - "bottom"
    - "chezmoi"
    - "eza"
    - "fastfetch"
    - "fd"
    - "ffmpeg"
    - "fzf"
    - "git" # Required before adding buckets
    - "gnupg"
    - "gzip"
    - "imagemagick"
    - "jq"
    - "lazygit"
    - "less"
    - "mise"
    - "neovim"
    - "openssh"
    - "pastel"
    - "ripgrep"
    - "sd"
    - "starship"
    - "unrar"
    - "unzip"
    - "vivid"
    - "wget"
    - "yazi"
    - "zoxide"
  scoop:
    - "nu"
    - "gh"
    - "delta"
    - "vscode"
  pacman:
    - "nushell"
    - "github-cli"
    - "git-delta"
    - "code"
