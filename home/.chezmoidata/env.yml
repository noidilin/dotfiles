env:
  xdg:
    XDG_CONFIG_HOME: [".config"]
    XDG_DATA_HOME: [".local", "share"]
    XDG_CACHE_HOME: [".cache"]
    XDG_STATE_HOME: [".local", "state"]
    XDG_BIN_HOME: [".local", "bin"]

  dev:
    TF_CLI_CONFIG_FILE: [".config", "terraform", "config.tfrc"]
    NPM_CONFIG_CACHE: [".dev", "npm", "cache"]
    NPM_CONFIG_USERCONFIG: [".dev", "npm", "npmrc"]
    NPM_CONFIG_PREFIX: [".dev", "npm", "prefix"]
    NPM_BIN_HOME: [".dev", "npm", "prefix", "bin"]
    PNPM_HOME: [".dev", "pnpm"]
    YARN_CACHE_FOLDER: [".dev", "yarn", "cache"]
    YARN_GLOBAL_FOLDER: [".dev", "yarn", "global"]
    YARN_BIN_HOME: [".dev", "yarn", "bin"]
    BUN_INSTALL_GLOBAL_DIR: [".dev", "bun", "install", "global"]
    BUN_INSTALL_BIN: [".dev", "bun", "bin"]
    BUN_INSTALL_CACHE_DIR: [".dev", "bun", "install", "cache"]
    CARGO_HOME: [".dev", "cargo"]
    RUSTUP_HOME: [".dev", "rustup"]
    GOPATH: [".dev", "go"]
    GOBIN: [".dev", "go", "bin"]
    UV_CONFIG_FILE: [".config", "uv", "uv.toml"]
    UV_CACHE_DIR: [".dev", "uv", "cache"]
    UV_PYTHON_INSTALL_DIR: [".dev", "uv", "python"]
    UV_TOOL_DIR: [".dev", "uv", "tools"]
    UV_TOOL_BIN_DIR: [".dev", "uv", "bin"]
    MASON_BIN_HOME: [".local", "share", "nvim", "mason", "bin"]

  other:
    WAKATIME_HOME: [".config", "wakatime"]
    BLENDER_USER_RESOURCES: [".local", "etc", "blender"]

  path:
    - XDG_BIN_HOME
    - MASON_BIN_HOME
    - PNPM_HOME
    - NPM_BIN_HOME
    - YARN_BIN_HOME
    - BUN_INSTALL_BIN
    - CARGO_HOME
    - GOBIN
    - UV_TOOL_BIN_DIR
