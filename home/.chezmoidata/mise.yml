mise:
  tools:
    opencode: "latest"
    bun: "latest"
    node:
      version: "lts"
      postinstall: "corepack enable pnpm"
    python: "latest"
    uv: "latest"
    rust:
      windows:
        version: "stable-gnu"
        profile: "minimal"
      linux:
        version: "stable"
        profile: "default"
      darwin:
        version: "stable"
        profile: "default"
    go: "latest"
    terraform: "latest"
    terragrunt: "latest"
    # Managed here so they stop floating outside any config. Versions stay
    # floating on purpose — pin the exact one in each project's mise.toml.
    kubectl: "latest"
    helm: "latest"
  settings:
    experimental: true
    python.uv_venv_auto: true
