mise:
  tools:
    opencode: "latest"
    bun: "latest"
    node:
      version: "lts"
      postinstall: "corepack enable pnpm"
    python: "latest"
    uv: "latest"
    rust:
      windows:
        version: "stable-gnu"
        profile: "minimal"
      linux:
        version: "stable"
        profile: "default"
      darwin:
        version: "stable"
        profile: "default"
    go: "latest"
    terraform: "latest"
    terragrunt: "latest"
    # PostgreSQL is intentionally project-only. Projects that need it should
    # declare an exact `postgres` version in their own mise.toml.
    # Kubernetes clients have global fallbacks so they stop floating outside
    # config. Pin the exact versions in each project's mise.toml.
    kubectl: "latest"
    helm: "latest"
  settings:
    experimental: true
    python.uv_venv_auto: true
