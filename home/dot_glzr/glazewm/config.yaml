general:
  startup_commands: ["shell-exec zebar"]

  shutdown_commands: ["shell-exec taskkill /IM zebar.exe /F"]

  config_reload_commands: []

  focus_follows_cursor: false

  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true

    trigger: "window_focus"

  hide_method: "cloak"

  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true

  inner_gap: "10px"

  outer_gap:
    top: "52px"
    right: "10px"
    bottom: "10px"
    left: "10px"

window_effects:
  focused_window:
    border:
      enabled: true
      color: "#707070"

    hide_title_bar:
      enabled: false

    corner_style:
      enabled: false
      style: "rounded"

    transparency:
      enabled: false
      opacity: "95%"

  other_windows:
    border:
      enabled: true
      color: "#353535"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: "rounded"
    transparency:
      enabled: false
      opacity: "0%"

window_behavior:
  initial_state: "tiling"

  state_defaults:
    floating:
      centered: true

      shown_on_top: false

    fullscreen:
      maximized: false

      shown_on_top: false

workspaces:
  - name: "1"
    display_name: ""
    keep_alive: true
    bind_to_monitor: 0
  - name: "2"
    display_name: ""
    keep_alive: true
    bind_to_monitor: 1
  - name: "3"
    display_name: ""
    keep_alive: false
    bind_to_monitor: 0
  - name: "4"
    display_name: ""
    keep_alive: false
    bind_to_monitor: 1
  - name: "5"
    display_name: "󰅶"
    keep_alive: false
    bind_to_monitor: 0
  - name: "6"
  - name: "7"
  - name: "8"
  - name: "9"

window_rules:
  - commands: ["ignore"]
    match:
      - window_process: { equals: "zebar" }

      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }

      - window_process: { equals: "PowerToys" }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: "PowerToys" }
        window_title: { regex: ".*? - Peek" }
      - window_process: { equals: "Lively" }
        window_class: { regex: "HwndWrapper" }
      - window_process:
          { regex: "Flow.Launcher|PowerPoint Slide Show|PotPlayer|ShareX" }
      - window_title: { equals: "Command Palette" }

  - commands: ["move --workspace 3", "focus --workspace 3"]
    match:
      - window_process: { regex: "Obsidian" }
      - window_process: { regex: "blender" }
        window_title: { regex: "Shader Editor" }

  - commands: ["move --workspace 2", "toggle-fullscreen", "focus --workspace 2"]
    match:
      - window_process: { regex: "blender" }
        window_title: { regex: "Preferences" }

  - commands: ["set-floating"]
    match:
      - window_process: { regex: "Cavalry" }
        window_title: { regex: "Cavalry|Rename" }

binding_modes:
  - name: "edit"
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["h"]
      - commands: ["resize --width +2%"]
        bindings: ["l"]
      - commands: ["resize --height +2%"]
        bindings: ["k"]
      - commands: ["resize --height -2%"]
        bindings: ["j"]
      - commands: ["resize --width -10%"]
        bindings: ["shift+h"]
      - commands: ["resize --width +10%"]
        bindings: ["shift+l"]
      - commands: ["resize --height +10%"]
        bindings: ["shift+k"]
      - commands: ["resize --height -10%"]
        bindings: ["shift+j"]
      - commands: ["move --direction left"]
        bindings: ["alt+h"]
      - commands: ["move --direction right"]
        bindings: ["alt+l"]
      - commands: ["move --direction up"]
        bindings: ["alt+k"]
      - commands: ["move --direction down"]
        bindings: ["alt+j"]
      - commands: ["wm-disable-binding-mode --name edit"]
        bindings: ["escape", "alt+shift+e"]

  - name: "extra"
    keybindings:
      - commands: ["close", "wm-disable-binding-mode --name extra"]
        bindings: ["alt+q"]
      - commands: ["set-minimized", "wm-disable-binding-mode --name extra"]
        bindings: ["alt+m"]
      - commands: ["wm-exit"]
        bindings: ["alt+shift+q"]
      - commands: ["wm-reload-config", "wm-disable-binding-mode --name extra"]
        bindings: ["alt+shift+r"]
      - commands: ["wm-redraw", "wm-disable-binding-mode --name extra"]
        bindings: ["alt+shift+w"]
      - commands:
          [
            "shell-exec %userprofile%/scoop/apps/wezterm/current/wezterm-gui.exe",
            "wm-disable-binding-mode --name extra",
          ]
        bindings: ["alt+enter"]
      - commands: ["wm-disable-binding-mode --name extra"]
        bindings: ["escape", "alt+shift+g"]

  - name: "pause"
    keybindings:
      - commands: ["wm-disable-binding-mode --name pause"]
        bindings: ["ctrl+alt+shift+p"]

keybindings:
  - commands: ["focus --direction left"]
    bindings: ["alt+h"]
  - commands: ["focus --direction right"]
    bindings: ["alt+l"]
  - commands: ["focus --direction up"]
    bindings: ["alt+k"]
  - commands: ["focus --direction down"]
    bindings: ["alt+j"]

  - commands: ["wm-enable-binding-mode --name edit"]
    bindings: ["alt+shift+e"]
  - commands: ["wm-enable-binding-mode --name extra"]
    bindings: ["alt+shift+g"]
  - commands: ["wm-enable-binding-mode --name pause"]
    bindings: ["ctrl+alt+shift+p"]

  - commands: ["toggle-tiling-direction"]
    bindings: ["alt+v"]

  - commands: ["wm-cycle-focus"]
    bindings: ["alt+shift+t"]

  - commands: ["toggle-floating --centered"]
    bindings: ["alt+t"]

  - commands: ["toggle-fullscreen"]
    bindings: ["alt+shift+m"]

  - commands: ["focus --workspace 1"]
    bindings: ["alt+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["alt+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["alt+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["alt+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["alt+5"]
  - commands: ["focus --workspace 6"]
    bindings: ["alt+6"]
  - commands: ["focus --workspace 7"]
    bindings: ["alt+7"]
  - commands: ["focus --workspace 8"]
    bindings: ["alt+8"]
  - commands: ["focus --workspace 9"]
    bindings: ["alt+9"]

  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["alt+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["alt+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["alt+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["alt+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["alt+shift+5"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["alt+shift+6"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["alt+shift+7"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["alt+shift+8"]
  - commands: ["move --workspace 9", "focus --workspace 9"]
    bindings: ["alt+shift+9"]
